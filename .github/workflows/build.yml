name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Extract Zip File
      run: |
        if ls *.zip 1> /dev/null 2>&1; then
          echo "Unzipping uploaded project..."
          unzip -o *.zip
        fi

    - name: Fix Missing Launcher Icon
      run: |
        RES_DIR=$(find . -type d -name "res" | head -n 1)
        if [ -n "$RES_DIR" ]; then
          mkdir -p "$RES_DIR/drawable"
          echo '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#00000000" android:pathData="M0,0h108v108h-108z"/></vector>' > "$RES_DIR/drawable/ic_launcher_foreground.xml"
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK with Installed Gradle
      run: |
        BUILD_FILE=$(find . -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)
        if [ -z "$BUILD_FILE" ]; then
          echo "No build.gradle found!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$BUILD_FILE")
        cd "$PROJECT_DIR"
        gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/*.apk'
        
